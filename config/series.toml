# Registri seri: satu blok [[series]] per seri. Pipeline hanya menarik seri yang ada di sini.
#
# Kunci wajib: id, source (kode di config/sources.csv), frequency (A, Q, M, D), unit, concept,
# name (nama Indonesia untuk situs), citation.
# Seri yang diambil dari API: dataset dan query (path + query string setelah alamat dasar sumber).
# Query BPS: "domain/<kode>/var/<id variabel>/sejak/<tahun>" plus filter opsional "?vervar=..&turvar=.."
# (angka saja); beberapa variabel dipisah " + " dan untuk periode yang sama variabel terakhir menang.
# Query tabel statis BPS: "domain/0000/tabel/908/kolom/<umum, inti, diatur, atau bergejolak>/sejak/<tahun>".
# Key dan id tahun (th) ditambahkan kode saat permintaan dibuat; key tidak pernah ditulis di sini.
# Seri turunan: derive ("yoy", "ratio", "share", atau "chain") dan inputs (id seri lain), tanpa query.
# Opsional: country (bawaan IDN), is_target (bawaan false), actual_only (khusus WEO: buang tahun
# proyeksi, simpan hanya tahun sampai LATEST_ACTUAL_ANNUAL_DATA).
# concept: level, index, yoy, avg_yoy, eop_yoy, rate, round_rate (lihat SCHEMA.md). round_rate dipakai
# semua nilai per ronde Sakernas, termasuk jumlah orang, karena pembandingnya ronde bulan yang sama.
# rate juga dipakai perubahan bulanan (m-to-m) BPS: dua desimal, dan pembandingnya bulan sebelumnya.

# --- Target, tahunan (IMF WEO) ---

[[series]]
id = "idn_gdp_growth_a"
source = "imf"
dataset = "WEO"
query = "IMF.RES,WEO/IDN.NGDP_RPCH.A?startPeriod=2000"
actual_only = true
frequency = "A"
unit = "%"
concept = "yoy"
is_target = true
name = "Pertumbuhan ekonomi (PDB riil), tahunan"
citation = "International Monetary Fund, World Economic Outlook database, https://data.imf.org/en/datasets/IMF.RES:WEO"

[[series]]
id = "idn_cpi_eop_a"
source = "imf"
dataset = "WEO"
query = "IMF.RES,WEO/IDN.PCPIEPCH.A?startPeriod=2000"
actual_only = true
frequency = "A"
unit = "%"
concept = "eop_yoy"
is_target = true
name = "Inflasi akhir tahun (Desember dibanding Desember)"
citation = "International Monetary Fund, World Economic Outlook database, https://data.imf.org/en/datasets/IMF.RES:WEO"

[[series]]
id = "idn_unemp_a"
source = "imf"
dataset = "WEO"
query = "IMF.RES,WEO/IDN.LUR.A?startPeriod=2000"
actual_only = true
frequency = "A"
unit = "% angkatan kerja"
concept = "rate"
is_target = true
name = "Tingkat pengangguran terbuka, tahunan"
citation = "International Monetary Fund, World Economic Outlook database, https://data.imf.org/en/datasets/IMF.RES:WEO"

# --- Target, kuartalan dan bulanan (salinan IMF dari data BPS) ---

[[series]]
id = "idn_gdp_real_q"
source = "imf"
dataset = "QNEA"
query = "IMF.STA,QNEA/IDN.B1GQ.Q.NSA.XDC.Q?startPeriod=2000-Q1&detail=dataonly"
frequency = "Q"
unit = "rupiah, harga konstan"
concept = "level"
name = "PDB riil kuartalan"
citation = "International Monetary Fund, Quarterly National Economic Accounts (QNEA), https://data.imf.org/en/datasets/IMF.STA:QNEA"

[[series]]
id = "idn_gdp_growth_q"
source = "imf"
