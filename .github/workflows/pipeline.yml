name: Pipeline data

# Cron ditulis dalam UTC. 17 23 * * * = 06.17 WIB keesokan harinya (WIB = UTC + 7). Menit 17
# dipilih karena awal jam adalah waktu tersibuk GitHub. Jadwal dan push memakai mode run.
on:
  schedule:
    - cron: "17 23 * * *"
  push:
    branches: [main]
    paths: ["config/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "run: ambil dan publikasi; full_refresh: tulis ulang semua observasi; migrate: migrasi SQL lalu uji akses"
        type: choice
        options: [run, full_refresh, migrate]
        default: run

permissions:
  contents: read

concurrency:
  group: con-fore-pipeline
  queue: max

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Pasang dependensi dari lockfile berhash
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Tes
        run: python -m unittest discover -s tests -v
      - name: Pipeline
        env:
          MODE: ${{ inputs.mode || 'run' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          case "$MODE" in
            migrate) python -m confore migrate ;;
            full_refresh) python -m confore run --full-refresh ;;
            *) python -m confore run ;;
          esac
